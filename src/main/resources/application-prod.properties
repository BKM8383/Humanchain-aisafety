# 1. Use Railway’s DATABASE_URL env var
#    (Railway auto-sets DATABASE_URL=postgres://user:pass@host:port/dbname)
spring.datasource.url=${DATABASE_URL:} 

# 2. Tell Spring Boot to convert the URI to JDBC format
#    (since Spring Boot 2.4+, this conversion happens automatically)
#    If you’re on an older Spring Boot, uncomment the next line:
# spring.datasource.url=${DATABASE_URL:} 
spring.datasource.username=${DATABASE_USERNAME:${DATABASE_URL_USER}}
spring.datasource.password=${DATABASE_PASSWORD:${DATABASE_URL_PASSWORD}}

# 3. Remove explicit driver-class; let Spring infer from URL
# spring.datasource.driver-class-name=org.postgresql.Driver

# 4. JPA (Postgres) settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# 5. Bind to Railway’s dynamic port
server.port=${PORT:8080}
